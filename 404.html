<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found | RustyLM</title>
    <meta name="description" content="The page you are looking for does not exist on RustyLM website.">
    <link rel="icon" id="favicon" type="image/png" href="images/icon-dark.png">
    <script>
        (function() {
            const mode = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-mode', mode);
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-emerald-500 selection:text-white flex flex-col min-h-screen">

    <div id="cursorGlow" class="cursor-glow"></div>

    <svg class="hidden">
        <symbol id="gh-icon" viewBox="0 0 24 24">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </symbol>
    </svg>

    <!-- Floating Navbar -->
    <div class="nav-container">
        <nav class="nav-content">
            <div class="flex items-center gap-2.5">
                <a href="index.html" class="btn-secondary p-1.5 rounded-xl flex items-center justify-center transition hover:scale-105" title="Back to Home">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </a>
                <a href="index.html" class="flex items-center gap-2.5 hover:opacity-90 transition cursor-pointer">
                    <img id="navIcon" src="images/icon-dark.png" alt="RustyLM icon" class="w-9 h-9 object-contain">
                    <span class="font-black text-xl tracking-tight hidden sm:inline-block">Rusty<span class="primary-color">LM</span></span>
                </a>
            </div>
            <div class="hidden md:flex items-center gap-8 text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">
                <a href="docs.html" class="hover:text-[var(--text)] hover:primary-color transition">Docs</a>
                <a href="benchmarks.html" class="hover:text-[var(--text)] hover:primary-color transition">Benchmarks</a>
                <a href="contacts.html" class="hover:text-[var(--text)] hover:primary-color transition">Contacts</a>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <a href="https://github.com/Kem0wow/rustylm" target="_blank" class="github-star-badge hidden sm:flex px-3.5 py-1.5 rounded-xl text-xs font-semibold items-center gap-2 transition">
                    <svg class="w-4 h-4 fill-current"><use href="#gh-icon"/></svg>
                    <i data-lucide="star" class="w-3.5 h-3.5 star-colored"></i>
                    <span class="starCountEl">3</span>
                </a>
                <button id="modeToggle" class="btn-secondary p-2 rounded-xl flex items-center justify-center transition" aria-label="Toggle Theme"></button>
            </div>
        </nav>
    </div>

    <!-- Main Error Section -->
    <main class="flex-grow flex items-center justify-center px-6 py-20 relative z-10 text-center">
        <div class="window-frame max-w-lg p-8 sm:p-12 space-y-6">
            <span class="text-6xl sm:text-8xl font-black gradient-text code-font block">404</span>
            <h1 class="text-2xl sm:text-3xl font-black">Page Not Found</h1>
            <p class="text-sm text-[var(--text-muted)] leading-relaxed">
                The requested URL was not found on this server. Check the URL or return back to home page.
            </p>
            <a href="index.html" class="bg-primary text-white font-bold text-xs uppercase tracking-wider px-6 py-3.5 rounded-xl inline-flex items-center gap-2 transition hover:opacity-90 shadow-lg">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>Return to Home</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto px-6 sm:px-8 py-12 themed-divider relative z-10 w-full">
        <div class="flex flex-col md:flex-row items-center justify-between gap-8">
            <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
                <img id="footerIcon" src="images/icon-dark.png" alt="RustyLM icon" class="w-8 h-8 object-contain">
                <span class="font-black text-xl tracking-tight">RustyLM</span>
            </a>
            <div class="flex flex-wrap justify-center gap-8 text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">
                <a href="index.html" class="hover:text-[var(--text)] hover:primary-color transition">Home</a>
                <a href="docs.html" class="hover:text-[var(--text)] hover:primary-color transition">Docs</a>
                <a href="benchmarks.html" class="hover:text-[var(--text)] hover:primary-color transition">Benchmarks</a>
                <a href="contacts.html" class="hover:text-[var(--text)] hover:primary-color transition">Contribute & Contact</a>
                <a href="https://github.com/Kem0wow/rustylm" target="_blank" class="hover:text-[var(--text)] hover:primary-color transition">GitHub</a>
            </div>
        </div>
    </footer>

    <script>
        const modeToggle = document.getElementById('modeToggle');
        function updateTheme(mode) {
            document.documentElement.setAttribute('data-mode', mode);
            localStorage.setItem('theme', mode);
            if (modeToggle) {
                modeToggle.innerHTML = mode === 'dark' 
                    ? `<i data-lucide="sun" class="w-4 h-4 text-yellow-400"></i>` 
                    : `<i data-lucide="moon" class="w-4 h-4 text-slate-700"></i>`;
                if (window.lucide) lucide.createIcons();
            }
            const navIcon = document.getElementById('navIcon');
            const footerIcon = document.getElementById('footerIcon');
            if (navIcon) navIcon.src = mode === 'dark' ? 'images/icon-dark.png' : 'images/icon-light.png';
            if (footerIcon) footerIcon.src = mode === 'dark' ? 'images/icon-dark.png' : 'images/icon-light.png';
        }

        updateTheme(localStorage.getItem('theme') || 'dark');
        if (modeToggle) {
            modeToggle.addEventListener('click', () => {
                const mode = document.documentElement.getAttribute('data-mode') === 'dark' ? 'light' : 'dark';
                updateTheme(mode);
            });
        }

        async function fetchStarCount() {
            try {
                const res = await fetch('https://api.github.com/repos/Kem0wow/rustylm');
                if (res.ok) {
                    const data = await res.json();
                    if (data.stargazers_count !== undefined) {
                        const count = Math.max(3, data.stargazers_count);
                        document.querySelectorAll('.starCountEl').forEach(el => el.textContent = count);
                        localStorage.setItem('gh_stars', count);
                        return;
                    }
                }
            } catch (e) {}
            document.querySelectorAll('.starCountEl').forEach(el => el.textContent = '3');
        }
        fetchStarCount();

        window.addEventListener('load', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
